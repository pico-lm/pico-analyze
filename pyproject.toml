[tool.poetry]
name = "pico-analyze"
version = "1.0.0"
description = "A companion toolkit to pico-train for quantifying, comparing, and visualizing how language models evolve during training."
authors = ["Richard Diehl Martinez <richard@picolm.io>"]
license = "Apache 2.0"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10,<3.13"
huggingface-hub = {extras = ["cli"], version = "^0.25.1"}
torch = "^2.5.1"
datasets = "^3.2.0"
rich = "^13.9.4"
pre-commit = "^4.2.0"
wandb = "^0.19.5"
pico-report = {version = "^1.0.0", optional = true}

[tool.poetry.extras]
pico-report = ["pico-report"]

[tool.poetry.scripts]
analyze = "scripts.analyze:main"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
jupyter = "^1.1.1"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]  # Error, pyflakes, isort (import sorting)
ignore = ["E501"]  # Let ruff format handle line length

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
